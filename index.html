<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<title>한 사람 몫의 식탁</title>
<style>
  /* 갈무리 픽셀 글꼴 — Galmuri © Lee Minseo, SIL Open Font License 1.1 (assets/fonts/Galmuri-LICENSE.txt) */
  @font-face { font-family: "Galmuri11"; src: url("assets/fonts/Galmuri11.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Galmuri11"; src: url("assets/fonts/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Galmuri9"; src: url("assets/fonts/Galmuri9.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Galmuri14"; src: url("assets/fonts/Galmuri14.woff2") format("woff2"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #0c0e16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 816 / 624)); aspect-ratio: 816 / 624; }
  #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges;
          touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; transition: filter .6s; }
  #game.sepia { filter: sepia(0.85) saturate(0.8) contrast(0.92) brightness(1.02); }
  #name-entry { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58%;
                background: linear-gradient(#0e0a14f2, #040308f4); border: 1px solid #c8bede; border-radius: 0; padding: 4% 5%;
                outline: 1px solid #000; box-shadow: inset 0 0 0 3px #08060c, inset 0 0 0 4px #5e5672;
                font-family: "Galmuri11","Noto Sans KR",sans-serif; color: #e8e2f2; text-align: center; -webkit-font-smoothing: none; }
  #name-entry label { display: block; font-family: inherit; font-size: clamp(12px, 2.3vw, 24px); margin-bottom: 4%; color: #c9b8ec; }
  #name-input { width: 62%; font-size: clamp(12px, 2.6vw, 24px); padding: 2% 3%; border-radius: 0; text-align: center;
                background: #050408; color: #e8e2f2; border: 1px solid #5e5672; outline: none; font-family: inherit; }
  #name-input:focus { border-color: #c4283a; }
  #name-ok { margin-left: 3%; font-size: clamp(12px, 2.2vw, 20px); padding: 2% 5%; border-radius: 0; border: 2px solid #05040a;
             background: #c4283a; color: #f4eef8; font-weight: bold; cursor: pointer; box-shadow: inset 0 0 0 1px #e05060; font-family: inherit; }
  .shake { animation: sh .3s; }
  /* ---- 터치 기기 전용: 가상 방향키 · 가로 안내 ---- */
  #pad, #abtn { position: fixed; z-index: 20; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.touch #pad, body.touch #abtn { display: block; }
  #pad { left: max(10px, env(safe-area-inset-left)); bottom: 14px; width: 138px; height: 138px; }
  #pad button, #abtn button { position: absolute; border: 1px solid #c8bede; background: rgba(6,4,10,.8); color: #c8bede;
     font: 20px "Galmuri9","Noto Sans KR",sans-serif; padding: 0; -webkit-tap-highlight-color: transparent; }
  #pad button { width: 46px; height: 46px; border-radius: 8px; }
  #pad .u { left: 46px; top: 0; } #pad .d { left: 46px; top: 92px; } #pad .l { left: 0; top: 46px; } #pad .r { left: 92px; top: 46px; }
  #pad .c { left: 51px; top: 51px; width: 36px; height: 36px; border-radius: 50%; background: rgba(20,24,38,.4); pointer-events: none; }
  #abtn { right: max(10px, env(safe-area-inset-right)); bottom: 14px; width: 132px; height: 138px; }
  #abtn button { width: 64px; height: 64px; border-radius: 50%; font-size: 15px; color: #ece8f2; }
  #abtn .a { right: 0; top: 18px; background: rgba(231,223,205,.82); color: #1c2233; border-color: #c9b48a; }
  #abtn .b { left: 0; top: 72px; }
  #pad button.on, #abtn button.on { background: rgba(231,223,205,.9); color: #1c2233; }
  #rotate { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(8,10,18,.94); color: #ece8f2;
     font-family: "Noto Sans KR",sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #rotate.show { display: flex; }
  #rotate .phone { width: 46px; height: 78px; border: 3px solid #c9b48a; border-radius: 9px; animation: rot 2.2s ease-in-out infinite; }
  @keyframes rot { 0%,25% { transform: rotate(0); } 55%,100% { transform: rotate(-90deg); } }
  #rotate p { margin: 0; font-size: 17px; line-height: 1.6; }
  #rotate small { color: #8e8aa4; font-size: 13px; }
  #rotate button { margin-top: 6px; background: none; border: 1px solid rgba(150,146,172,.8); color: #ece8f2; padding: 8px 18px; border-radius: 4px; font: 14px "Noto Sans KR",sans-serif; }
  @keyframes sh { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="816" height="624"></canvas>
  <div id="name-entry" hidden>
    <label for="name-input">이름을 입력해 주세요 (최대 6자)</label>
    <input id="name-input" maxlength="6" autocomplete="off"><button id="name-ok">확인</button>
  </div>
</div>
<div id="pad" aria-hidden="true"><button class="u" data-k="ArrowUp">▲</button><button class="l" data-k="ArrowLeft">◀</button><button class="r" data-k="ArrowRight">▶</button><button class="d" data-k="ArrowDown">▼</button><div class="c"></div></div>
<div id="abtn" aria-hidden="true"><button class="a" data-k="KeyZ">결정</button><button class="b" data-k="KeyX">메뉴</button></div>
<div id="rotate"><div class="phone"></div><p>휴대폰을 <b>가로</b>로 돌려 주세요.<br><small>가로 화면에서 글자가 더 크게 보여요.</small></p><button id="rotate-skip">세로로 계속하기</button></div>
<script src="js/lang_en.js"></script>
<script src="js/engine.js"></script>
<script src="js/chase.js"></script>
<script src="js/story.js"></script>
<script>boot();</script>
</body>
</html>
